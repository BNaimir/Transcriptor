<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcriptor Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root { --morado-pro: #6a1b9a; --morado-suave: #f3e5f5; --blanco: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--morado-suave); display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #contenedor { width: 100%; max-width: 750px; background: var(--blanco); padding: 30px; border-radius: 25px; box-shadow: 0 10px 30px rgba(106, 27, 154, 0.2); }
        h1 { color: var(--morado-pro); text-align: center; }
        #resultado { 
            width: 100%; height: 400px; border: 2px solid #e1bee7; border-radius: 15px; 
            padding: 20px; margin: 20px 0; font-size: 1.1rem; overflow-y: auto;
            line-height: 1.6; white-space: pre-wrap; box-sizing: border-box; background: #fff;
        }
        .controles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 15px; border: none; border-radius: 12px; cursor: pointer; color: white; font-weight: bold; transition: 0.3s; }
        .btn-start { background: #7b1fa2; grid-column: span 2; }
        .btn-clean { background: #9c27b0; }
        .btn-pdf { background: #4a148c; }
        button:hover { opacity: 0.8; transform: scale(0.98); }
        .status { text-align: center; color: #6a1b9a; margin-top: 15px; font-weight: 500; }
    </style>
</head>
<body>

<div id="contenedor">
    <h1>🎙️ Transcriptor </h1>
    <div id="resultado" contenteditable="true" placeholder="Tu texto limpio aparecerá aquí..."></div>
    
    <div class="controles">
        <button id="btnDictar" class="btn-start">▶ INICIAR DICTADO</button>
        <button id="btnLimpiar" class="btn-clean">✨ LIMPIAR REPETICIONES</button>
        <button id="btnDescargar" class="btn-pdf">📄 EXPORTAR PDF</button>
    </div>
    <p id="estado" class="status">Listo para transcribir sin bucles.</p>
</div>

<script>
    const { jsPDF } = window.jspdf;
    const resultado = document.getElementById('resultado');
    const estado = document.getElementById('estado');
    let ultimaFrase = "";
    let ultimaVezHablado = Date.now();

    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (Recognition) {
        const reconocimiento = new Recognition();
        reconocimiento.lang = 'es-ES';
        reconocimiento.interimResults = false; // EVITA EL BUCLE DEL PDF
        reconocimiento.continuous = true;

        reconocimiento.onresult = (event) => {
            let fraseNueva = event.results[event.results.length - 1][0].transcript.trim();
            let ahora = Date.now();

            // 1. Evitar duplicados exactos inmediatos
            if (fraseNueva.toLowerCase() === ultimaFrase.toLowerCase()) return;

            // 2. Lógica de Párrafos Automáticos (3 segundos de silencio)
            if (ahora - ultimaVezHablado > 3000 && resultado.innerText !== "") {
                resultado.innerText += "\n\n";
            }

            // 3. Añadir texto con puntuación básica
            resultado.innerText += fraseNueva.charAt(0).toUpperCase() + fraseNueva.slice(1) + ". ";
            
            ultimaFrase = fraseNueva;
            ultimaVezHablado = ahora;
            resultado.scrollTop = resultado.scrollHeight;
        };

        // FUNCIÓN MAGNA: LIMPIAR TEXTO
        document.getElementById('btnLimpiar').addEventListener('click', () => {
            let texto = resultado.innerText;
            // Elimina palabras que se repiten una tras otra (ej: "primeramente primeramente")
            let limpio = texto.replace(/\b(\w+)( \1\b)+/gi, "$1");
            // Elimina frases repetidas detectadas por la IA
            resultado.innerText = limpio;
            estado.innerText = "✨ ¡Texto optimizado!";
        });

        document.getElementById('btnDictar').addEventListener('click', () => {
            reconocimiento.start();
            estado.innerText = "🟣 Escuchando... los párrafos se crean solos.";
        });

        document.getElementById('btnDescargar').addEventListener('click', () => {
            const doc = new jsPDF();
            const splitText = doc.splitTextToSize(resultado.innerText, 180);
            doc.text(splitText, 10, 20);
            doc.save("transcripcion_limpia.pdf");
        });

    } else {
        alert("Navegador no compatible.");
    }
</script>
</body>
</html>
